<div class="nutrition-grid">
  <div class="nutrition-card calories">
    <span class="label">{{ 'NUTRITION_GRID.CALORIES' | translate }}</span>
    <div class="value-container">
      <tm-ng-odometer 
        [number]="calories" 
        [config]="{ animation: 'count', theme: 'minimal', duration: 500 }">
      </tm-ng-odometer>
      <small>kcal</small>
    </div>
  </div>

  <div class="nutrition-card">
    <span class="label">{{ 'NUTRITION_GRID.PROTEIN' | translate }}</span>
    <div class="value-container">
      <tm-ng-odometer 
        [number]="protein" 
        [config]="{ animation: 'count', theme: 'minimal', duration: 500 }">
      </tm-ng-odometer>
      <small>g</small>
    </div>
  </div>

  <div class="nutrition-card">
    <span class="label">{{ 'NUTRITION_GRID.CARBOHYDRATE' | translate }}</span>
    <div class="value-container">
      <tm-ng-odometer 
        [number]="carbohydrate" 
        [config]="{ animation: 'count', theme: 'minimal', duration: 500 }">
      </tm-ng-odometer>
      <small>g</small>
    </div>
  </div>

  <div class="nutrition-card">
    <span class="label">{{ 'NUTRITION_GRID.FAT' | translate }}</span>
    <div class="value-container">
      <tm-ng-odometer 
        [number]="fat" 
        [config]="{ animation: 'count', theme: 'minimal', duration: 500 }">
      </tm-ng-odometer>
      <small>g</small>
    </div>
  </div>

  <div class="nutrition-card">
    <span class="label">{{ 'NUTRITION_GRID.FIBER' | translate }}</span>
    <div class="value-container">
      <tm-ng-odometer 
        [number]="fiber" 
        [config]="{ animation: 'count', theme: 'minimal', duration: 500 }">
      </tm-ng-odometer>
      <small>g</small>
    </div>
  </div>
</div>
