<mat-toolbar>
  <button matIconButton class="menu-icon" (click)="toggleSidenav()">
    <mat-icon>menu</mat-icon>
  </button>
  
  <span>Foobs</span>

  <span class="spacer"></span>

  <app-language-selector />
</mat-toolbar>

<mat-drawer-container>
  <mat-drawer mode="over" [opened]="sidenavOpened" autoFocus="false">  
    <mat-nav-list>
      <a mat-list-item routerLink="/"(click)="toggleSidenav()">
        {{ 'MENU.HOME' | translate }}
      </a>

      <a mat-list-item routerLink="/add-food" (click)="toggleSidenav()">
        {{ 'MENU.ADD_FOOD' | translate }}
      </a>
      
      <a mat-list-item routerLink="/add-meal" (click)="toggleSidenav()">
        {{ 'MENU.ADD_MEAL' | translate }}
      </a>
    </mat-nav-list>
  </mat-drawer>

  <mat-drawer-content>
    <router-outlet />
  </mat-drawer-content>
</mat-drawer-container>
